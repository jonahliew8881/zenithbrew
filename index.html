  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

age 1):\n   color-primary, color-accent, color-base, color-primary-tint,\n   color-accent-tint, color-primary-shade, color-neutral. */\n\n:root {\n  /* Base palette (from brand guide) */\n  --color-primary: #1D2951;        /* deep navy — wordmark \"BREW\", ink */\n  --color-accent: #C5A059;         /* warm gold — wordmark \"ZENITH\", monogram Z */\n  --color-base: #F4F6FC;           /* pale cool white — page background */\n  --color-primary-tint: #8C93AD;   /* muted blue-grey */\n  --color-accent-tint: #DCC79A;    /* soft sand/gold */\n  --color-primary-shade: #0F1730;  /* near-black navy — darkest ink */\n  --color-neutral: #FFFFFF;        /* pure white */\n\n  /* Semantic aliases — use these in components, not the base tokens */\n  --surface-page: var(--color-base);\n  --surface-card: var(--color-neutral);\n  --surface-sunken: #EAEEF7;\n  --surface-inverse: var(--color-primary-shade);\n\n  --text-primary: var(--color-primary-shade);\n  --text-secondary: var(--color-primary-tint);\n  --text-on-accent: var(--color-neutral);\n  --text-on-inverse: var(--color-base);\n\n  --accent: var(--color-accent);\n  --accent-hover: #B08D45;\n  --accent-tint: var(--color-accent-tint);\n  --accent-shade: #9C7C3E;\n\n  --border-hairline: rgba(29, 41, 81, 0.16);\n  --border-hairline-strong: rgba(29, 41, 81, 0.32);\n  --border-accent: rgba(197, 160, 89, 0.55);\n\n  --focus-ring: var(--color-accent);\n\n  --state-success: #3E7A5C;\n  --state-warning: #B08D45;\n  --state-danger: #A34D3C;\n}\n<\u002Fstyle>\n<style>/* Zenith Brew — type scale\n   Display sizes are generous and airy (matches the wide-tracked wordmark);\n   body copy runs on the humanist geometric sans for legibility at UI sizes. */\n\n:root {\n  --text-display-xl: 600 clamp(3rem, 5vw, 5.5rem)/1.02 var(--font-display);\n  --text-display-lg: 500 clamp(2.25rem, 4vw, 3.5rem)/1.06 var(--font-display);\n  --text-display-md: 500 2rem/1.12 var(--font-display);\n  --text-heading-lg: 600 1.75rem/1.25 var(--font-body);\n  --text-heading-md: 600 1.375rem/1.3 var(--font-body);\n  --text-heading-sm: 600 1.125rem/1.35 var(--font-body);\n  --text-body-lg: 400 1.125rem/1.6 var(--font-body);\n  --text-body-md: 400 1rem/1.6 var(--font-body);\n  --text-body-sm: 400 0.875rem/1.5 var(--font-body);\n  --text-label: 500 0.8125rem/1.3 var(--font-body);\n  --text-eyebrow: 600 0.75rem/1.2 var(--font-body);\n  --text-script-accent: 600 1.5rem/1.3 var(--font-script);\n\n  --tracking-wordmark: 0.06em;\n  --tracking-eyebrow: 0.14em;\n  --tracking-tight: -0.01em;\n}\n<\u002Fstyle>\n<style>/* Zenith Brew — spacing\n   space-unit token named in guide page 2 (no numeric value supplied);\n   8px base unit chosen as a standard, comfortable rhythm. */\n\n:root {\n  --space-unit: 8px;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  --container-max: 1200px;\n  --container-narrow: 720px;\n}\n<\u002Fstyle>\n<style>/* Zenith Brew — radius, stroke, shadow, angle\n   radius-sm / radius-lg / stroke-hairline / angle-accent named in guide\n   page 2 (no numeric values supplied). Values below were chosen to match\n   the brand mark's geometry: thin hairline strokes, low-poly angled facets\n   (the mountain/triangle motif), and modest radii — corners are cut with\n   angle more often than heavily rounded. */\n\n:root {\n  --radius-sm: 4px;\n  --radius-md: 10px;\n  --radius-lg: 20px;\n  --radius-pill: 999px;\n\n  --stroke-hairline: 1px;\n  --stroke-medium: 1.5px;\n\n  --angle-accent: 8deg; /* @kind other */\n\n  --shadow-sm: 0 1px 2px rgba(15, 23, 48, 0.06), 0 1px 1px rgba(15, 23, 48, 0.04);\n  --shadow-md: 0 4px 16px rgba(15, 23, 48, 0.08), 0 1px 2px rgba(15, 23, 48, 0.06);\n  --shadow-lg: 0 16px 40px rgba(15, 23, 48, 0.14), 0 4px 12px rgba(15, 23, 48, 0.08);\n\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-standard: 220ms; /* @kind other */\n  --duration-slow: 360ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* Zenith Brew — webfonts\n   NOTE: no font files were supplied with the brand guide, and the guide PDF\n   only listed color tokens by name (no typeface names). The wordmark in\n   the logo uses a thin, wide-tracked serif (uppercase) for ZENITH/BREW and\n   a monoline connected script for the tagline. Nearest Google Fonts matches\n   are loaded below — see readme.md \"Typography\" for the substitution flag. */\n\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Caveat';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"b6935a00-8a76-416a-8191-c626d0993e93\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Caveat';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"7300a93a-0d62-4cd5-a470-e26051a9de87\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Caveat';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"375bb873-706b-4d39-87eb-2e05d2c4180f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Caveat';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"3c2ccaa0-9770-4920-81df-184971ca3bed\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-famil tin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"387d2b0b-1ad8-4037-9d9c-c97d8ac7913c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0a7cd6d8-c2c6-4ef6-9c08-826993f91877\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"08978388-15e5-48b3-bf55-b69e98ffe56f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Jost';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"387d2b0b-1ad8-4037-9d9c-c97d8ac7913c\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Semantic font family aliases, so components never hardcode a family name */\n:root {\n  --font-display: 'Cormorant Garamond', 'Times New Roman', serif; /* wordmark, headlines */\n  --font-body: 'Jost', 'Century Gothic', sans-serif;               /* UI text, body copy */\n  --font-script: 'Caveat', cursive;                                 /* tagline, accent notes */\n}\n\n/* Zenith Brew — color tokens\n   Base values are taken verbatim from the brand guide PDF (page 1):\n   color-primary, color-accent, color-base, color-primary-tint,\n   color-accent-tint, color-primary-shade, color-neutral. */\n\n:root {\n  /* Base palette (from brand guide) */\n  --color-primary: #1D2951;        /* deep navy — wordmark \"BREW\", ink */\n  --color-accent: #C5A059;         /* warm gold — wordmark \"ZENITH\", monogram Z */\n  --color-base: #F4F6FC;           /* pale cool white — page background */\n  --color-primary-tint: #8C93AD;   /* muted blue-grey */\n  --color-accent-tint: #DCC79A;    /* soft sand/gold */\n  --color-primary-shade: #0F1730;  /* near-black navy — darkest ink */\n  --color-neutral: #FFFFFF;        /* pure white */\n\n  /* Semantic aliases — use these in components, not the base tokens */\n  --surface-page: var(--color-base);\n  --surface-card: var(--color-neutral);\n  --surface-sunken: #EAEEF7;\n  --surface-inverse: var(--color-primary-shade);\n\n  --text-primary: var(--color-primary-shade);\n  --text-secondary: var(--color-primary-tint);\n  --text-on-accent: var(--color-neutral);\n  --text-on-inverse: var(--color-base);\n\n  --accent: var(--color-accent);\n  --accent-hover: #B08D45;\n  --accent-tint: var(--color-accent-tint);\n  --accent-shade: #9C7C3E;\n\n  --border-hairline: rgba(29, 41, 81, 0.16);\n  --border-hairline-strong: rgba(29, 41, 81, 0.32);\n  --border-accent: rgba(197, 160, 89, 0.55);\n\n  --focus-ring: var(--color-accent);\n\n  --state-success: #3E7A5C;\n  --state-warning: #B08D45;\n  --state-danger: #A34D3C;\n}\n\n/* Zenith Brew — type scale\n   Display sizes are generous and airy (matches the wide-tracked wordmark);\n   body copy runs on the humanist geometric sans for legibility at UI sizes. */\n\n:root {\n  --text-display-xl: 600 clamp(3rem, 5vw, 5.5rem)/1.02 var(--font-display);\n  --text-display-lg: 500 clamp(2.25rem, 4vw, 3.5rem)/1.06 var(--font-display);\n  --text-display-md: 500 2rem/1.12 var(--font-display);\n  --text-heading-lg: 600 1.75rem/1.25 var(--font-body);\n  --text-heading-md: 600 1.375rem/1.3 var(--font-body);\n  --text-heading-sm: 600 1.125rem/1.35 var(--font-body);\n  --text-body-lg: 400 1.125rem/1.6 var(--font-body);\n  --text-body-md: 400 1rem/1.6 var(--font-body);\n  --text-body-sm: 400 0.875rem/1.5 var(--font-body);\n  --text-label: 500 0.8125rem/1.3 var(--font-body);\n  --text-eyebrow: 600 0.75rem/1.2 var(--font-body);\n  --text-script-accent: 600 1.5rem/1.3 var(--font-script);\n\n  --tracking-wordmark: 0.06em;\n  --tracking-eyebrow: 0.14em;\n  --tracking-tight: -0.01em;\n}\n\n/* Zenith Brew — spacing\n   space-unit token named in guide page 2 (no numeric value supplied);\n   8px base unit chosen as a standard, comfortable rhythm. */\n\n:root {\n  --space-unit: 8px;\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 24px;\n  --space-6: 32px;\n  --space-7: 48px;\n  --space-8: 64px;\n  --space-9: 96px;\n  --space-10: 128px;\n\n  --container-max: 1200px;\n  --container-narrow: 720px;\n}\n\n/* Zenith Brew — radius, stroke, shadow, angle\n   radius-sm / radius-lg / stroke-hairline / angle-accent named in guide\n   page 2 (no numeric values supplied). Values below were chosen to match\n   the brand mark's geometry: thin hairline strokes, low-poly angled facets\n   (the mountain/triangle motif), and modest radii — corners are cut with\n   angle more often than heavily rounded. */\n\n:root {\n  --radius-sm: 4px;\n  --radius-md: 10px;\n  --radius-lg: 20px;\n  --radius-pill: 999px;\n\n  --stroke-hairline: 1px;\n  --stroke-medium: 1.5px;\n\n  --angle-accent: 8deg; /* @kind other */\n\n  --shadow-sm: 0 1px 2px rgba(15, 23, 48, 0.06), 0 1px 1px rgba(15, 23, 48, 0.04);\n  --shadow-md: 0 4px 16px rgba(15, 23, 48, 0.08), 0 1px 2px rgba(15, 23, 48, 0.06);\n  --shadow-lg: 0 16px 40px rgba(15, 23, 48, 0.14), 0 4px 12px rgba(15, 23, 48, 0.08);\n\n  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-standard: 220ms; /* @kind other */\n  --duration-slow: 360ms; /* @kind other */\n}\n\n<\u002Fstyle>\n<script src=\"2cea9206-325b-4baf-8b1d-6496a27f1c68\"><\u002Fscript>\n<script src=\"9bcb0bc2-7e70-4ecd-bba5-842c0a0c6282\"><\u002Fscript>\n\n<style>\n  body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:'Georgia Pro',Georgia,serif;-webkit-font-smoothing:antialiased}\n  a{color:var(--color-primary)}a:hover{color:var(--accent-shade)}\n  ::selection{background:var(--color-accent-tint)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"background:var(--surface-sunken);border-bottom:0.75px solid var(--border-hairline);text-align:center;padding:8px 24px;font-size:12.5px;letter-spacing:0.04em;color:var(--text-secondary)\">Prototype preview — prices, tasting notes, subscription terms and imagery are placeholders pending confirmation.<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"position:sticky;top:0;z-index:60\">\n<nav style=\"display:flex;align-items:center;justify-content:space-between;padding:{{ navPad }};background:var(--surface-card);border-bottom:0.75px solid var(--border-hairline)\">\n  <a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"text-decoration:none;display:flex;align-items:center\">\n    <img src=\"9143daa3-1916-46b2-8206-af4d8785f834\" alt=\"Zenith Brew\" style=\"height:{{ logoH }};width:auto;display:block\">\n  <\u002Fa>\n  <sc-if value=\"{{ notMobile }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;gap:34px;align-items:center\">\n      <sc-for list=\"{{ navLinks }}\" as=\"l\" hint-placeholder-count=\"5\">\n        <a href=\"#\" sc-camel-on-click=\"{{ l.go }}\" style=\"text-decoration:none;font-size:14px;letter-spacing:0.02em;color: {{ l.color }};border-bottom:{{ l.underline }};padding-bottom:3px\">{{ l.label }}<\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"display:flex;align-items:center;gap:10px\">\n    <div style=\"display:flex;align-items:center;gap:8px;border:0.75px solid var(--border-hairline-strong);border-radius:2px;padding:7px 14px;font-size:13px;color:var(--color-primary)\">Cart <span style=\"color:var(--color-accent);font-weight:600\">{{ cartCount }}<\u002Fspan><\u002Fdiv>\n    <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Menu\" style=\"background:none;border:0.75px solid var(--border-hairline-strong);border-radius:2px;padding:10px 9px;cursor:pointer;display:flex;flex-direction:column;gap:4px;justify-content:center\">\n        <span style=\"display:block;width:16px;height:1px;background:var(--color-primary)\"><\u002Fspan>\n        <span style=\"display:block;width:16px;height:1px;background:var(--color-primary)\"><\u002Fspan>\n        <span style=\"display:block;width:16px;height:1px;background:var(--color-primary)\"><\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fnav>\n<sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"background:var(--surface-card);border-bottom:0.75px solid var(--border-hairline);display:flex;flex-direction:column;box-shadow:var(--shadow-sm)\">\n    <sc-for list=\"{{ navLinks }}\" as=\"l\" hint-placeholder-count=\"5\">\n      <a href=\"#\" sc-camel-on-click=\"{{ l.go }}\" style=\"text-decoration:none;font-size:15px;padding:15px 22px;border-top:0.75px solid var(--border-hairline);color:{{ l.color }}\">{{ l.label }}<\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<!-- ============ HOME ============ -->\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div>\n    <!-- scroll-linked hero -->\n    <section style=\"height:{{ heroSectionH }};position:relative\" ref=\"{{ heroRefFn }}\">\n      <div style=\"position:{{ heroStick }};top:0;height:100vh;box-sizing:border-box;display:grid;grid-template-columns:{{ heroCols }};gap:{{ heroGap }};align-items:center;max-width:1200px;margin:0 auto;padding:{{ heroPad }};overflow:hidden\">\n        <div style=\"display:flex;flex-direction:column;gap:{{ heroLeftGap }}\">\n          <div style=\"font-size:12px;letter-spacing:0.18em;color:var(--text-secondary);font-family:Georgia,serif\">^ PREMIUM ARABICA STEEPING BAGS<\u002Fdiv>\n          <h1 style=\"font:var(--text-display-lg);font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:0.02em;color:var(--color-primary);margin:0;font-weight:500\">When focus<br>meets flavour.<\u002Fh1>\n          <p style=\"margin:0;max-width:44ch;font-size:16.5px;line-height:1.7;color:var(--text-primary)\">The layered flavour of a hand pour-over, condensed into a single steeping bag. One bag, one cup of hot water — a proper coffee break that never breaks your rhythm.<\u002Fp>\n          <div style=\"display:flex;gap:14px;margin-top:6px;flex-wrap:wrap\">\n            <button sc-camel-on-click=\"{{ goShop }}\" style=\"font-family:Georgia,serif;font-size:14.5px;background:var(--color-primary);color:#fff;border:1px solid var(--color-primary);border-radius:2px;padding:13px 26px;cursor:pointer;letter-spacing:0.03em\" style-hover=\"background:var(--color-primary-shade);border-color:var(--color-primary-shade)\">Shop steep bags<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goSub }}\" style=\"font-family:Georgia,serif;font-size:14.5px;background:transparent;color:var(--color-primary);border:0.75px solid var(--color-primary);border-radius:2px;padding:13px 26px;cursor:pointer;letter-spacing:0.03em\" style-hover=\"background:var(--color-primary);color:#ffffff\">How the subscription works<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--text-secondary);letter-spacing:0.06em\">SCROLL <span style=\"color:var(--color-accent)\">˅<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <!-- animation placeholder, scroll-driven -->\n        <div style=\"border:1px dashed var(--border-hairline-strong);border-radius:4px;background:var(--surface-card);padding:22px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n            <span style=\"font-size:11px;letter-spacing:0.16em;color:var(--color-accent);font-family:Georgia,serif\">^ HERO ANIMATION — PLACEHOLDER<\u002Fspan>\n            <span style=\"font-size:11px;color:var(--text-secondary);font-variant-numeric:tabular-nums\">scroll {{ heroPctText }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"position:relative;height:{{ heroPanelH }};border-radius:2px;background-color:var(--surface-sunken);background-image:radial-gradient(var(--color-accent-tint) 1.2px, transparent 1.2px);background-size:14px 14px;overflow:hidden\">\n            <div style=\"position:absolute;left:12%;right:12%;bottom:0;height:78%;clip-path:polygon(50% 0, 100% 100%, 0 100%);background:var(--color-primary-tint);opacity:0.35\"><\u002Fdiv>\n            <div style=\"position:absolute;left:12%;right:12%;bottom:0;height:{{ heroFillH }};clip-path:polygon(50% -260px, 100% 100%, 0 100%);background:var(--color-primary);transition:height 80ms linear\"><\u002Fdiv>\n            <div style=\"position:absolute;left:0;right:0;text-align:center;bottom:{{ heroCaretB }};transition:bottom 80ms linear;color:var(--color-accent);font-family:Georgia,serif;font-size:30px;line-height:1\">^<\u002Fdiv>\n            <div style=\"position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:11.5px;letter-spacing:0.08em;color:#fff;opacity:0.9\">YOUR ANIMATION EMBEDS HERE<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ notMobile }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"font-size:12.5px;line-height:1.6;color:var(--text-secondary)\">Scroll-linked: this panel receives a 0–100% progress value as you scroll. The finished animation will be scrubbed by the same value.<\u002Fdiv><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- three steep bags -->\n    <section style=\"max-width:1200px;margin:0 auto;padding:88px {{ padX }} 40px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\">\n        <h2 style=\"font:var(--text-display-md);font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--color-primary);margin:0\"><span style=\"color:var(--color-accent)\">^<\u002Fspan> The three steep bags<\u002Fh2>\n        <a href=\"#\" sc-camel-on-click=\"{{ goShop }}\" style=\"font-size:14px;text-decoration:none;color:var(--color-primary);border-bottom:0.75px solid var(--color-accent)\">View all steep bags<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 36px;color:var(--text-secondary);font-size:15px\">Two flavour families, one Reserve mark. No sprawling catalogue — three cups, chosen with care.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:{{ cols3 }};gap:24px\">\n        <sc-for list=\"{{ products }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"background:var(--surface-card);border:0.75px solid var(--border-hairline);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;transition:border-color 220ms\" style-hover=\"border-color:var(--border-accent)\">\n            <div style=\"height:210px;position:relative\">\n              <x-import component-from-global-scope=\"image-slot\" id=\"home-{{ p.id }}\" shape=\"rect\" placeholder=\"{{ p.photoLabel }}\" hint-size=\"100%,210px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1\">\n              <div style=\"display:flex;align-items:center;gap:8px\">\n                <span style=\"font-family:'Poiret One',Georgia,sans-serif;font-size:19px;letter-spacing:0.14em;color:var(--color-primary)\">{{ p.name }}<\u002Fspan>\n                <sc-if value=\"{{ p.reserve }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family:Georgia,serif;color:var(--color-accent);font-size:16px\" title=\"Reserve mark\">^<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"font-size:11.5px;letter-spacing:0.14em;color:var(--text-secondary)\">{{ p.originCaps }}<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.6;color:var(--text-primary);flex:1\">{{ p.note }}<\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:6px\">\n                <span style=\"font-size:15px;color:var(--color-primary)\">{{ p.price }} <span style=\"font-size:11.5px;color:var(--text-secondary)\">/ box of 7 {{ tbc }}<\u002Fspan><\u002Fspan>\n                <button sc-camel-on-click=\"{{ p.add }}\" style=\"font-family:Georgia,serif;font-size:13px;background:var(--color-primary);color:#fff;border:1px solid var(--color-primary);border-radius:2px;padding:8px 16px;cursor:pointer\" style-hover=\"background:var(--color-primary-shade)\">Add<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- subscription pitch — ink band -->\n    <section style=\"background:var(--color-primary-shade);margin-top:56px\">\n      <div style=\"max-width:1200px;margin:0 auto;padding:72px {{ padX }};display:grid;grid-template-columns:{{ cols2 }};gap:{{ gap2 }};align-items:center\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <div style=\"font-size:11.5px;letter-spacing:0.18em;color:var(--color-accent)\">^ THE SUBSCRIPTION<\u002Fdiv>\n          <h2 style=\"font:var(--text-display-md);font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:#fff;margin:0\">Your ritual, on your schedule.<\u002Fh2>\n          <p style=\"margin:0;color:var(--color-primary-tint);font-size:15.5px;line-height:1.7;max-width:46ch\">Pick your steep bag, choose a frequency, and a fresh box arrives before the last one runs out. Pause or cancel at any time.<\u002Fp>\n          <div><button sc-camel-on-click=\"{{ goSub }}\" style=\"font-family:Georgia,serif;font-size:14.5px;background:var(--color-accent);color:var(--color-primary-shade);border:1px solid var(--color-accent);border-radius:2px;padding:13px 26px;cursor:pointer;letter-spacing:0.03em\" style-hover=\"background:var(--accent-hover);border-color:var(--accent-hover)\">See how it works<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:{{ cols3 }};gap:1px;background:rgba(244,246,252,0.14);border:0.75px solid rgba(244,246,252,0.14)\">\n          <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <div style=\"background:var(--color-primary-shade);padding:24px 18px;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;color:var(--color-accent)\">{{ s.n }}<\u002Fdiv>\n              <div style=\"font-size:14px;color:#fff;letter-spacing:0.02em\">{{ s.t }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;line-height:1.55;color:var(--color-primary-tint)\">{{ s.d }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- social proof strip -->\n    <section style=\"max-width:1200px;margin:0 auto;padding:80px {{ padX }} 96px\">\n      <h2 style=\"font:var(--text-display-md);font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--color-primary);margin:0 0 36px\"><span style=\"color:var(--color-accent)\">^<\u002Fspan> In their words<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:{{ cols3 }};gap:24px\">\n        <sc-for list=\"{{ homeReviews }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"background:var(--surface-card);border:0.75px solid var(--border-hairline);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:12px\" style-hover=\"border-color:var(--border-accent)\">\n            <div style=\"color:var(--color-accent);letter-spacing:4px;font-size:12px\">{{ r.marks }}<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.65;color:var(--text-primary);flex:1\">“{{ r.quote }}”<\u002Fdiv>\n            <div style=\"font-size:12px;letter-spacing:0.1em;color:var(--text-secondary)\">{{ r.who }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"text-align:center;margin-top:28px\"><a href=\"#\" sc-camel-on-click=\"{{ goReviews }}\" style=\"font-size:14px;text-decoration:none;color:var(--color-primary);border-bottom:0.75px solid var(--color-accent)\">Read all reviews<\u002Fa><\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ STEEP BAGS ============ -->\n<sc-if value=\"{{ isShop }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:64px {{ padX }} 96px\">\n    <div style=\"max-width:640px;display:flex;flex-direction:column;gap:14px;margin-bottom:48px\">\n      <div style=\"font-size:12px;letter-spacing:0.18em;color:var(--text-secondary)\">^ STEEP BAGS<\u002Fdiv>\n      <h1 style=\"font:var(--text-display-lg);font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--color-primary);margin:0\">Steeped for clarity,<br>not just caffeine.<\u002Fh1>\n      <p style=\"margin:0;font-size:15.5px;line-height:1.7;color:var(--text-primary)\">Two flavour families — Fruity and Nutty — and one Reserve mark for the rare lots that sit at the peak of a family. Every bag holds meticulously selected Arabica, ground and dosed for a four-minute steep.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:{{ cols3 }};gap:24px;align-items:stretch\">\n      <sc-for list=\"{{ products }}\" as=\"p\" hint-placeholder-count=\"3\">\n        <div style=\"background:var(--surface-card);border:0.75px solid var(--border-hairline);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;transition:border-color 220ms\" style-hover=\"border-color:var(--border-accent)\">\n          <div style=\"height:240px;position:relative\">\n            <x-import component-from-global-scope=\"image-slot\" id=\"shop-{{ p.id }}\" shape=\"rect\" placeholder=\"{{ p.photoLabel }}\" hint-size=\"100%,240px\"><\u002Fx-import>\n          <\u002Fdiv>\n          <div style=\"padding:22px;display:flex;flex-direction:column;gap:10px;flex:1\">\n            <div style=\"display:flex;align-items:center;gap:8px\">\n              <span style=\"font-family:'Poiret One',Georgia,sans-serif;font-size:20px;letter-spacing:0.14em;color:var(--color-primary)\">{{ p.name }}<\u002Fspan>\n              <sc-if value=\"{{ p.reserve }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10px;letter-spacing:0.14em;color:var(--color-accent);border:0.75px solid var(--border-accent);border-radius:2px;padding:3px 7px\">^ RESERVE<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;letter-spacing:0.14em;color:var(--text-secondary)\">{{ p.originCaps }}<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.65;color:var(--text-primary);flex:1\">{{ p.note }} <span style=\"color:var(--text-secondary);font-size:12px\">{{ tbcNote }}<\u002Fspan><\u002Fdiv>\n            <div style=\"border-top:0.75px solid var(--border-hairline);padding-top:14px;display:flex;flex-direction:column;gap:8px\">\n              <div style=\"font-size:10.5px;letter-spacing:0.16em;color:var(--text-secondary)\">TWO WAYS TO BUY<\u002Fdiv>\n              <div style=\"display:flex;gap:10px\">\n                <button sc-camel-on-click=\"{{ p.add }}\" style=\"flex:1;font-family:Georgia,serif;font-size:13px;background:transparent;color:var(--color-primary);border:0.75px solid var(--color-primary);border-radius:2px;padding:10px 8px;cursor:pointer;line-height:1.4\" style-hover=\"background:var(--color-primary);color:#ffffff\">Box of 7 — {{ p.price }}<br><span style=\"font-size:10.5px;letter-spacing:0.08em;opacity:0.75\">ONE-TIME {{ tbc }}<\u002Fspan><\u002Fbutton>\n                <button sc-camel-on-click=\"{{ goSub }}\" style=\"flex:1;font-family:Georgia,serif;font-size:13px;background:var(--color-primary);color:#fff;border:1px solid var(--color-primary);border-radius:2px;padding:10px 8px;cursor:pointer;line-height:1.4\" style-hover=\"background:var(--color-primary-shade)\">Subscribe<br><span style=\"font-size:10.5px;letter-spacing:0.08em;opacity:0.85\">{{ p.subPrice }} / BOX {{ tbc }}<\u002Fspan><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <!-- compare -->\n    <div style=\"margin-top:64px;background:var(--surface-card);border:0.75px solid var(--border-hairline);border-radius:4px;padding:36px 40px\">\n      <h2 style=\"font:var(--text-display-md);font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;color:var(--color-primary);margin:0 0 6px\"><span style=\"color:var(--color-accent)\">^<\u002Fspan> How to choose<\u002Fh2>\n      <p style=\"margin:0 0 28px;font-size:14px;color:var(--text-secondary)\">Specifics over adjectives — bean source, process and finish. Details to be confirmed at first roast.<\u002Fp>\n      <div style=\"overflow-x:auto\"><div style=\"display:grid;grid-template-columns:150px 1fr 1fr 1fr;font-size:14px;line-height:1.6;min-width:680px\">\n        <sc-for list=\"{{ compareRows }}\" as=\"row\" hint-placeholder-count=\"5\">\n          <div style=\"padding:13px 0;border-top:0.75px solid var(--border-hairline);font-size:11px;letter-spacing:0.14em;color:var(--text-secondary);align-self:center\">{{ row.label }}<\u002Fdiv>\n          <div style=\"padding:13px 16px 13px 0;border-top:0.75px solid var(--border-hairline);color:var(--text-primary)\">{{ row.a }}<\u002Fdiv>\n          <div style=\"padding:13px 16px 13px 0;border-top:0.75px solid var(--border-hairline);color:var(--text-primary)\">{{ row.b }}<\u002Fdiv>\n          <div style=\"padding:13px 36px;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:grid;grid-template-columns:{{ formCols }};gap:18px\">\n          <x-import component-from-global-scope=\"ZenithBrewDesignSystem_1e4669.Input\" label=\"Name\" placeholder=\"Your name\" hint-size=\"100%,68px\"><\u002Fx-import>\n          <x-import component-from-global-scope=\"ZenithBrewDesignSystem_1e4669.Input\" label=\"Email\" placeholder=\"you@company.com\" type=\"email\" hint-size=\"100%,68px\"><\u002Fx-import>\n        <\u002Fdiv>\n        <x-import component-from-global-scope=\"ZenithBrewDesignSystem_1e4669.Input\" label=\"Subject\" placeholder=\"Orders, wholesale, press…\" hint-size=\"100%,68px\"><\u002Fx-import>\n        <label style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-size:13px;color:var(--text-primary)\">Message<\u002Fspan>\n          <textarea rows=\"5\" placeholder=\"One question per note gets the fastest answer.\" style=\"font-family:Georgia,serif;font-size:14.5px;padding:10px 14px;border-radius:2px;border:0.75px solid var(--border-hairline-strong);background:var(--surface-card);color:var(--text-primary);resize:vertical;outline:none\"><\u002Ftextarea>\n        <\u002Flabel>\n        <div style=\"display:flex;align-items:center;gap:16px\">\n          <button sc-camel-on-click=\"{{ sendMessage }}\" style=\"font-family:Georgia,serif;font-size:14.5px;background:var(--color-primary);color:#fff;border:1px solid var(--color-primary);border-radius:2px;padding:12px 28px;cursor:pointer\" style-hover=\"background:var(--color-primary-shade)\">Send message<\u002Fbutton>\n          <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13px;color:var(--state-success)\">Received. We reply within two working days.<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:24px\">\n        <div style=\"background:var(--surface-card);border:0.75px solid
